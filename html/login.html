<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BaraElectric | Iniciar Sesión</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link rel="stylesheet" href="../css/stylelogin.css">
</head>
<body>

<div class="container login-container">
  <!-- Login Card -->
  <div class="login-card" id="loginCard">
    <h3 class="text-center">Iniciar Sesión</h3>
    <form id="loginForm">
      <div class="mb-3">
        <label for="correoLogin" class="form-label">Correo electrónico</label>
        <input type="email" id="correoLogin" class="form-control" required />
      </div>
      <div class="mb-3">
        <label for="passwordLogin" class="form-label">Contraseña</label>
        <input type="password" id="passwordLogin" class="form-control" required />
      </div>
      <button type="submit" class="btn btn-primary w-100">Iniciar Sesión</button>
      <p id="errorLogin" class="text-danger text-center mt-2 d-none">Credenciales incorrectas</p>
    </form>
    <p class="text-center mt-3 text-muted">¿No tienes cuenta? <a href="#" id="showRegister">Regístrate</a></p>
  </div>

  <!-- Register Card -->
  <div class="login-card d-none" id="registerCard">
    <h3 class="text-center">Crear Cuenta</h3>
    <form id="registerForm">
      <div class="mb-3">
        <label for="nombre" class="form-label">Nombre completo</label>
        <input type="text" id="nombre" class="form-control" required />
      </div>
      <div class="mb-3">
        <label for="correo" class="form-label">Correo electrónico</label>
        <input type="email" id="correo" class="form-control" required />
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Contraseña</label>
        <input type="password" id="password" class="form-control" required />
      </div>
      <div class="mb-3">
        <label for="confirmPassword" class="form-label">Confirmar contraseña</label>
        <input type="password" id="confirmPassword" class="form-control" required />
      </div>
      <p id="errorPasswordMatch" class="text-danger text-center mt-2 d-none">Las contraseñas no coinciden.</p>
      <button type="submit" class="btn btn-success w-100">Registrarse</button>
      <p id="errorRegister" class="text-danger text-center mt-2 d-none">Error al registrar usuario</p>
    </form>
    <p class="text-center mt-3 text-muted">¿Ya tienes cuenta? <a href="#" id="showLogin">Inicia sesión</a></p>
  </div>
</div>

<script src="../js/controllerlogin.js"></script>
</body>
</html>
