<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BaraElectric | Admin Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link rel="stylesheet" href="../../css/stylelogin.css">
</head>
<body>

<div class="container login-container mt-5">
  <!-- Admin Login Card -->
  <div class="login-card p-4 shadow rounded" id="adminLoginCard">
    <h3 class="text-center mb-4">Iniciar Sesión Administrador</h3>
    
    <form id="adminLoginForm">
      <div class="mb-3">
        <label for="correoAdmin" class="form-label">Correo electrónico</label>
        <input type="email" id="correoAdmin" class="form-control" required />
      </div>
      <div class="mb-3">
        <label for="passwordAdmin" class="form-label">Contraseña</label>
        <input type="password" id="passwordAdmin" class="form-control" required />
      </div>
      <button type="submit" class="btn btn-dark w-100">Iniciar Sesión</button>
      <p id="errorAdminLogin" class="text-danger text-center mt-2 d-none">Credenciales incorrectas</p>
    </form>
  </div>
</div>

<script src="../../js/admin/adminlogincontroller.js"></script>
</body>
</html>
