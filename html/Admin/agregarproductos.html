<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agregar Producto</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../../css/styleindexadmin.css">
</head>
<body class="bg-light">
    <div class="container py-5">
      <h2 class="mb-4" id="tituloFormulario">Agregar Nuevo Producto</h2>
      <form id="formNuevoProducto" enctype="multipart/form-data">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label">Nombre</label>
            <input type="text" name="nombre" class="form-control" required>
          </div>
          <div class="col-md-3">
            <label class="form-label">Precio</label>
            <input type="number" name="precio" class="form-control" required>
          </div>
          <div class="col-md-3">
            <label class="form-label">Stock</label>
            <input type="number" name="stock" class="form-control" required>
          </div>
  
          <div class="col-md-4">
            <label class="form-label">Categoría</label>
            <select name="categoriaId" id="categoriaId" class="form-select" required></select>
          </div>
          <div class="col-md-4">
            <label class="form-label">Marca</label>
            <select name="marcaId" id="marcaId" class="form-select" required></select>
          </div>
          <div class="col-md-4">
            <label class="form-label">Proveedor</label>
            <select name="proveedorId" id="proveedorId" class="form-select" required></select>
          </div>
  
          <div class="col-md-8">
            <label class="form-label">Descripción</label>
            <input type="text" name="descripcion" class="form-control" required>
          </div>
  
          <div class="col-md-6">
            <label class="form-label">Imágenes del producto</label>
            <input type="file" name="imagenes" id="imagenes" class="form-control" multiple required>
          </div>
  
          <div class="col-md-6 d-flex align-items-end">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" value="true" name="estado" id="estado">
              <label class="form-check-label" for="estado">Activo</label>
            </div>
          </div>
  
          <div class="col-12 d-flex justify-content-between">
            <button class="btn btn-secondary" type="button" id="cancelarBtn">Cancelar</button>
            <button class="btn btn-primary" type="submit">Registrar Producto</button>
          </div>
          
  
          <!-- Previsualización de imágenes (modo edición) -->
          <div class="col-12 mt-3">
            <div id="previewImagenes" class="preview-container">
              <!-- Aquí se insertarán las imágenes cargadas del producto -->
            </div>
          </div>
        </div>
      </form>
    </div>
  
    <script src="../../js/admin/agregarproductos.js"></script>
  </body>
  </html>
