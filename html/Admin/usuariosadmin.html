<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Administrador - Usuarios</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../../css/styleindexadmin.css">
</head>
<body>

  <!-- Barra lateral -->
  <div class="sidebar">
    <h4>Administración</h4>
    <nav class="nav flex-column">
      <a class="nav-link" href="indexadmin.html">Productos</a>
      <a class="nav-link active" href="usuariosadmin.html">Usuarios</a>
      <a class="nav-link" href="#">Pedidos</a>
      <a class="nav-link" href="#" id="btnLogout">Cerrar sesión</a>
    </nav>
  </div>

  <!-- Contenido principal -->
  <div class="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h3>Gestión de Usuarios</h3>
      <button class="btn btn-primary" onclick="abrirFormulario()">Nuevo Usuario</button>
    </div>

    <div class="table-responsive">
      <table class="table table-bordered table-hover align-middle text-center" id="tablaUsuarios">
        <thead class="table-dark">
          <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Correo</th>
            <th>Dirección</th>
            <th>Contacto</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="usuariosBody">
          <!-- Usuarios dinámicos -->
        </tbody>
      </table>
    </div>
  </div>

 <!-- Modal para crear/editar usuario -->
<div class="modal fade" id="modalUsuario" tabindex="-1" aria-labelledby="modalTitulo" aria-hidden="true">
  <div class="modal-dialog">
    <form class="modal-content" id="formUsuario">
      <div class="modal-header">
        <h5 class="modal-title" id="modalTitulo">Nuevo Usuario</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="usuarioId">

        <div class="mb-3">
          <label for="nombre" class="form-label">Nombre</label>
          <input type="text" class="form-control" id="nombre" required>
        </div>

        <div class="mb-3">
          <label for="correo" class="form-label">Correo</label>
          <input type="email" class="form-control" id="correo" required>
        </div>

        <div class="mb-3">
          <label for="direccion" class="form-label">Dirección</label>
          <input type="text" class="form-control" id="direccion">
        </div>

        <div class="mb-3">
          <label for="contacto" class="form-label">Contacto</label>
          <input type="text" class="form-control" id="contacto">
        </div>

        <div class="mb-3">
          <label for="contraseña" class="form-label">Nueva Contraseña</label>
          <input type="password" class="form-control" id="contraseña" placeholder="Dejar vacío para no cambiar">
        </div>

        <div class="mb-3">
          <label for="confirmarContraseña" class="form-label">Confirmar Contraseña</label>
          <input type="password" class="form-control" id="confirmarContraseña" placeholder="Repetir contraseña">
        </div>

      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="submit" class="btn btn-primary">Guardar Usuario</button>
      </div>
    </form>
  </div>
</div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../js/admin/usuarioscontroller.js"></script>
</body>
</html>
