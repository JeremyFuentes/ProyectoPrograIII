<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Administrador - Productos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../../css/styleindexadmin.css">
</head>
<body>
  <!-- Barra lateral -->
  <div class="sidebar">
    <h4>Administración</h4>
    <nav class="nav flex-column">
      <a class="nav-link active" href="indexadmin.html">Productos</a>
      <a class="nav-link" href="usuariosadmin.html">Usuarios</a>
      <a class="nav-link" href="#">Pedidos</a>
      <a class="nav-link" href="#" id="btnLogout">Cerrar sesión</a>
    </nav>
  </div>

  <!-- Contenido principal -->
  <div class="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h3>Gestión de Productos</h3>
      <a href="agregarproductos.html" class="btn btn-success">Agregar Producto</a>
    </div>

    <!-- Tabla de productos -->
    <table class="table table-striped" id="tablaProductos">
      <thead>
        <tr>
          <th>ID</th>
          <th>Nombre</th>
          <th>Precio</th>
          <th>Stock</th>
          <th>Categoría</th>
          <th>Marca</th>
          <th>Proveedor</th>
          <th>SKU</th>
          <th>Descripción</th>
          <th>Estado</th>
          <th>Imagen</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody>
        <!-- Productos serán agregados aquí por JS -->
      </tbody>
    </table>
  </div>

<script src="../../js/admin/adminprodcutoscontroller.js"></script>
</body>
</html>
